
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Player</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }
    .player {
      max-width: 900px;
      margin: 30px auto;
    }
    video {
      display: block;
      width: 100%;
      background: black;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <main class="player">
    <h2>Video Player</h2>
    <video controls playsinline preload="metadata">
      <source src="/api/video" type="video/mp4">
      Your browser does not support video playback.
    </video>
  </main>
</body>
</html>
